{% set name = "kim-convergence" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: b13b626e323a9b35078ea75dcb1e56840d9d54f9d841390ec1369732e210a0f9

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vvv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - versioneer >=0.29
    - kim-edn >1.4.0
    - numpy >1.16
    - scipy
    - joblib
  run:
    - python >={{ python_min }}
    - kim-edn >1.4.0
    - numpy >1.16
    - scipy
    - joblib

test:
  requires:
    - python {{ python_min }}
  imports:
    - kim_convergence

about:
  home: https://github.com/openkim/kim-convergence
  license: LGPL-2.1-or-later
  license_family: LGPL
  license_file: LICENSE
  summary: KIM-CONVERGENCE utility module
  description: |
    KIM-CONVERGENCE utility module.
    The objective is to make it as easy as possible to help in automatic
    equilibration detection & run length control.

extra:
  recipe-maintainers:
    - yafshar
